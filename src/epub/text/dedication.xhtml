		<section id="dedication" epub:type="dedication">
			<h2 epub:type="title">Dedication</h2>
			<p>To the Memory of</p>
			<br/>
			<p><b>Alberta</b>,</p>
			<br/>
			<p>Who, in the absence of this her oldest</p>
			<br/>
			<p>brother, crossed over the dark stream, smiling</p>
			<br/>
			<p>as she went, this volume is most</p>
			<br/>
			<p>affectionately dedicated by</p>
			<br/>
			<p><b>The Author</b>.</p>
		</section>
	</body>
