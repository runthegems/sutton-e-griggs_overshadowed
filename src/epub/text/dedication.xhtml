			<h2 epub:type="title">Dedication</h2>
			<p>
				<span>To the Memory of</span>
				<br/>
				<span><b>Alberta</b>,</span>
				<br/>
				<span>Who, in the absence of this her oldest</span>
				<br/>
				<span>brother, crossed over the dark stream, smiling</span>
				<br/>
				<span>as she went, this volume is most</span>
				<br/>
				<span>affectionately dedicated by</span>
				<br/>
				<span><b>The Author</b>.</span>
			</p>
		</section>
